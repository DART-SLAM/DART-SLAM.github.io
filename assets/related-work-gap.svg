<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DART-SLAM related-work novelty threat ranking</title>
  <desc id="desc">A qualitative ranking of the six prior works that overlap most strongly with DART-SLAM, followed by the remaining open combination: RGB-only recovery without a post-loss pose, false-anchor rejection, metric-scale recovery, and disconnected-map reconnection.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#20252b" flood-opacity=".08"/>
    </filter>
    <linearGradient id="gap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e4d7e"/>
      <stop offset="1" stop-color="#1769aa"/>
    </linearGradient>
    <style>
      text{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;fill:#15191e}
      .kicker{font-size:13px;font-weight:700;letter-spacing:2.4px;fill:#1769aa}
      .title{font-size:43px;font-weight:800;letter-spacing:-1.3px}
      .sub{font-size:16px;fill:#66707a}
      .gapLabel{font-size:12px;font-weight:800;letter-spacing:1.8px;fill:#bcdcf4}
      .gapMain{font-size:23px;font-weight:800;fill:#fff}
      .gapChip{font-size:14px;font-weight:700;fill:#fff}
      .col{font-size:11px;font-weight:800;letter-spacing:1.5px;fill:#7b858e}
      .rank{font-size:18px;font-weight:800;fill:#fff;text-anchor:middle}
      .method{font-size:20px;font-weight:800}
      .overlap{font-size:16px;font-weight:700;fill:#384149}
      .missing{font-size:14px;font-weight:700;fill:#a23c31}
      .sideHead{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#66707a}
      .sideItem{font-size:15px;font-weight:700}
      .sideMuted{font-size:13px;fill:#66707a}
      .footerHead{font-size:11px;font-weight:800;letter-spacing:1.4px;fill:#66707a}
      .footerText{font-size:14px;font-weight:700;fill:#343d45}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f5f4ef"/>
  <text x="70" y="58" class="kicker">RELATED WORK · NOVELTY OVERLAP · 2026-08-24</text>
  <text x="70" y="111" class="title">WHO THREATENS THE CLAIM?</text>
  <text x="70" y="143" class="sub">Qualitative novelty-overlap rank — not an accuracy leaderboard.</text>

  <rect x="70" y="170" width="1460" height="105" rx="18" fill="url(#gap)" filter="url(#shadow)"/>
  <text x="98" y="202" class="gapLabel">REMAINING OPEN COMBINATION</text>
  <text x="98" y="241" class="gapMain">RGB-only · design CAD · no POST pose · false-anchor rejection · metric scale · map reconnection</text>
  <rect x="1353" y="197" width="145" height="48" rx="24" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".42"/>
  <text x="1425" y="226" class="gapChip" text-anchor="middle">DART target</text>

  <rect x="70" y="305" width="1050" height="545" rx="20" fill="#fff" stroke="#dedfdd" filter="url(#shadow)"/>
  <text x="106" y="341" class="col">RANK / WORK</text>
  <text x="382" y="341" class="col">OVERLAP</text>
  <text x="824" y="341" class="col">DECISIVE GAP</text>

  <!-- 1 -->
  <rect x="96" y="358" width="998" height="68" rx="13" fill="#fff8f6" stroke="#eed7d2"/>
  <circle cx="130" cy="392" r="21" fill="#bd4639"/>
  <text x="130" y="399" class="rank">1</text>
  <text x="168" y="399" class="method">BIM-vSLAM</text>
  <text x="382" y="398" class="overlap">Mono · BIM · global SLAM</text>
  <rect x="813" y="375" width="251" height="35" rx="18" fill="#fff" stroke="#d98b82"/>
  <text x="938" y="398" class="missing" text-anchor="middle">× disconnected restart</text>

  <!-- 2 -->
  <rect x="96" y="438" width="998" height="68" rx="13" fill="#fff9f6" stroke="#eeddd3"/>
  <circle cx="130" cy="472" r="21" fill="#cb5b3e"/>
  <text x="130" y="479" class="rank">2</text>
  <text x="168" y="479" class="method">SVO-DT</text>
  <text x="382" y="478" class="overlap">Digital twin · VIO fusion</text>
  <rect x="813" y="455" width="251" height="35" rx="18" fill="#fff" stroke="#dc9a85"/>
  <text x="938" y="478" class="missing" text-anchor="middle">× IMU + global init</text>

  <!-- 3 -->
  <rect x="96" y="518" width="998" height="68" rx="13" fill="#fffbf6" stroke="#eee1d2"/>
  <circle cx="130" cy="552" r="21" fill="#d46e40"/>
  <text x="130" y="559" class="rank">3</text>
  <text x="168" y="559" class="method">PiLoT</text>
  <text x="382" y="558" class="overlap">Mono · sequential 3D map</text>
  <rect x="813" y="535" width="251" height="35" rx="18" fill="#fff" stroke="#dfa386"/>
  <text x="938" y="558" class="missing" text-anchor="middle">× needs first coarse pose</text>

  <!-- 4 -->
  <rect x="96" y="598" width="998" height="68" rx="13" fill="#fffdf8" stroke="#eee6d6"/>
  <circle cx="130" cy="632" r="21" fill="#db8147"/>
  <text x="130" y="639" class="rank">4</text>
  <text x="168" y="639" class="method">GS-CPR</text>
  <text x="382" y="638" class="overlap">MASt3R · render depth · PnP</text>
  <rect x="813" y="615" width="251" height="35" rx="18" fill="#fff" stroke="#e2b08d"/>
  <text x="938" y="638" class="missing" text-anchor="middle">× needs coarse pose</text>

  <!-- 5 -->
  <rect x="96" y="678" width="998" height="68" rx="13" fill="#fffdf8" stroke="#eee7d8"/>
  <circle cx="130" cy="712" r="21" fill="#e0924e"/>
  <text x="130" y="719" class="rank">5</text>
  <text x="168" y="719" class="method">Render2Loc</text>
  <text x="382" y="718" class="overlap">Render · depth · PnP</text>
  <rect x="813" y="695" width="251" height="35" rx="18" fill="#fff" stroke="#e5bb98"/>
  <text x="938" y="718" class="missing" text-anchor="middle">× needs GPS/compass/gravity</text>

  <!-- 6 -->
  <rect x="96" y="758" width="998" height="68" rx="13" fill="#fffef9" stroke="#eee8d8"/>
  <circle cx="130" cy="792" r="21" fill="#e5a356"/>
  <text x="130" y="799" class="rank">6</text>
  <text x="168" y="799" class="method">MeshLoc</text>
  <text x="382" y="798" class="overlap">Mesh · depth lift · PnP</text>
  <rect x="813" y="775" width="251" height="35" rx="18" fill="#fff" stroke="#e7c5a4"/>
  <text x="938" y="798" class="missing" text-anchor="middle">× no temporal recovery</text>

  <!-- Right summary -->
  <rect x="1150" y="305" width="380" height="545" rx="20" fill="#fff" stroke="#dedfdd" filter="url(#shadow)"/>
  <text x="1180" y="344" class="sideHead">ALREADY OCCUPIED</text>
  <circle cx="1190" cy="381" r="10" fill="#267a4d"/>
  <path d="M1185 381l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1213" y="387" class="sideItem">CAD / mesh pose</text>
  <circle cx="1190" cy="425" r="10" fill="#267a4d"/>
  <path d="M1185 425l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1213" y="431" class="sideItem">Render–match–PnP</text>
  <circle cx="1190" cy="469" r="10" fill="#267a4d"/>
  <path d="M1185 469l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1213" y="475" class="sideItem">DT drift constraints</text>

  <line x1="1180" y1="507" x2="1500" y2="507" stroke="#e2e3e1"/>
  <text x="1180" y="544" class="sideHead">STILL OPEN TOGETHER</text>
  <circle cx="1190" cy="580" r="9" fill="#fff" stroke="#1769aa" stroke-width="2.5"/>
  <text x="1213" y="586" class="sideItem">No POST pose</text>
  <circle cx="1190" cy="620" r="9" fill="#fff" stroke="#1769aa" stroke-width="2.5"/>
  <text x="1213" y="626" class="sideItem">Reject false anchor</text>
  <circle cx="1190" cy="660" r="9" fill="#fff" stroke="#1769aa" stroke-width="2.5"/>
  <text x="1213" y="666" class="sideItem">Recover metric scale</text>
  <circle cx="1190" cy="700" r="9" fill="#fff" stroke="#1769aa" stroke-width="2.5"/>
  <text x="1213" y="706" class="sideItem">Reconnect submaps</text>

  <rect x="1180" y="748" width="320" height="72" rx="13" fill="#eef5fb"/>
  <text x="1198" y="774" class="sideHead" fill="#1769aa">DART NOW</text>
  <text x="1198" y="799" class="sideItem">Offline dev</text>
  <text x="1310" y="799" class="sideMuted">Held-out online pending</text>

  <!-- Secondary works -->
  <rect x="70" y="880" width="1460" height="78" rx="16" fill="#fff" stroke="#dedfdd"/>
  <text x="96" y="911" class="footerHead">SECONDARY PRIOR ART</text>
  <text x="96" y="938" class="footerText">Pos3R · UGS-Loc · GSVisLoc · RAP · diS-Graphs · ivS-Graphs · BIM-object relocation · HLoc · InLoc</text>
  <line x1="1125" y1="898" x2="1125" y2="943" stroke="#dedfdd"/>
  <text x="1152" y="911" class="footerHead">BACKBONES</text>
  <text x="1152" y="938" class="footerText">HI-SLAM2 · MASt3R-SLAM · WildGS-SLAM</text>

  <text x="70" y="987" class="sideMuted">Threat rank reflects overlap with DART’s claim, not method quality or benchmark accuracy. Scope: primary works audited through 24 Aug 2026.</text>
</svg>
